services:
  - type: web
    name: design-intelligence-mvp
    env: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run db:migrate && npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: design-intelligence-postgres
          property: connectionString
      - key: PGSSLMODE
        value: require
      - key: UPLOAD_LIMIT_MB
        value: 4

databases:
  - name: design-intelligence-postgres
    plan: starter
